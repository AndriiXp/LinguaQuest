name: CI

# Главная задача этого workflow — компилировать проект на macOS,
# потому что ни на Windows, ни в облачной сессии Swift-компилятора нет.
# Любая ошибка сборки должна всплывать здесь, а не на устройстве.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Сборка и тесты
    runs-on: macos-latest
    timeout-minutes: 40
    # Нужно, чтобы workflow мог записать результат сборки обратно в репозиторий.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Окружение
        run: |
          xcodebuild -version
          swift --version

      # Быстрые проверки идут первыми: они не требуют Xcode и ловят
      # часть ошибок за секунду вместо десяти минут сборки.
      - name: Проверка контента, зависимостей и алгоритмов
        run: |
          python3 Tools/validate_content.py
          python3 Tools/check_module_deps.py
          python3 Tools/reference_algorithms.py

      - name: Установить XcodeGen
        run: brew install xcodegen

      - name: Сгенерировать проект
        run: xcodegen generate

      - name: Выбрать симулятор
        id: sim
        run: |
          # Имя конкретной модели меняется от образа к образу,
          # поэтому берём первый доступный iPhone, а не хардкодим «iPhone 16».
          NAME=$(xcrun simctl list devices available \
            | grep -Eo 'iPhone [0-9A-Za-z ]+ \(' \
            | head -1 | sed 's/ (//' | xargs)
          if [ -z "$NAME" ]; then
            echo "Не найден ни один симулятор iPhone"; xcrun simctl list devices available; exit 1
          fi
          echo "Симулятор: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Пакет объявлен как iOS-only, поэтому `swift test` на хосте его не соберёт —
      # тесты гоняем через симулятор, схемой пакета.
      - name: Тесты пакета LinguaQuestKit
        working-directory: Packages/LinguaQuestKit
        run: |
          set -o pipefail
          xcodebuild -list 2>&1 | tee ../../schemes.log
          xcodebuild test \
            -scheme LinguaQuestKit-Package \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath ../../TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ../../swift-test.log

      - name: Сборка приложения
        run: |
          set -o pipefail
          xcodebuild build \
            -project LinguaQuest.xcodeproj \
            -scheme LinguaQuest \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log

      - name: Отчёт об ошибках
        if: failure()
        run: |
          {
            echo "### Ошибки"
            echo '```'
            grep -hE "error:|failed|FAIL" xcodebuild.log swift-test.log 2>/dev/null \
              | grep -v "^$" | head -60 || echo "Ошибок по шаблону не найдено — смотри артефакт build-logs"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Логи Actions читаются только с авторизацией, поэтому короткая выжимка
      # кладётся прямо в репозиторий: её видно в открытом виде, и разбирать
      # падение можно без доступа к аккаунту и без ручного копирования.
      - name: Записать результат в репозиторий
        if: always()
        run: |
          mkdir -p ci-status
          {
            echo "# Сборка #${{ github.run_number }} — ${{ job.status }}"
            echo
            echo "- Коммит: \`${{ github.sha }}\`"
            echo "- Время: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- Запуск: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            if [ "${{ job.status }}" = "success" ]; then
              echo "Сборка и тесты прошли. Можно запускать «Сборка IPA для телефона»."
            else
              echo '## Ошибки компиляции'
              echo '```'
              grep -hE "error:" xcodebuild.log swift-test.log 2>/dev/null | sort -u | head -60 \
                || echo "(не найдено по шаблону error: — смотри полный лог в артефактах)"
              echo '```'
              echo
              echo '## Упавшие тесты'
              echo '```'
              grep -hE "^Test Case.*failed|XCTAssert.*failed" swift-test.log 2>/dev/null | head -40 \
                || echo "(нет)"
              echo '```'
            fi
          } > ci-status/last-build.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-status/last-build.md
          # [skip ci] и то, что пуш идёт под GITHUB_TOKEN, исключают зацикливание.
          git commit -m "CI: результат сборки #${{ github.run_number }} [skip ci]" || exit 0
          git pull --rebase --autostash || true
          git push || echo "Не удалось записать результат — не критично, есть артефакты"

      - name: Логи
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            xcodebuild.log
            swift-test.log
            schemes.log
          retention-days: 14
          if-no-files-found: ignore
