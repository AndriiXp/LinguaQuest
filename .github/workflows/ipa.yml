name: Сборка IPA для телефона

# Собирает неподписанный .ipa, который затем подписывается на твоём компьютере
# через Sideloadly бесплатным Apple ID. Подпись здесь не выполняется намеренно:
# для неё нужен платный Apple Developer Program.
#
# Запуск: вкладка Actions → «Сборка IPA для телефона» → Run workflow.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  ipa:
    name: Неподписанный IPA
    runs-on: macos-latest
    timeout-minutes: 40
    # Отчёт о сборке кладётся в сам репозиторий: логи Actions требуют
    # авторизации, а файл в публичном репозитории читается свободно.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Версия Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app || true
          xcodebuild -version

      - name: Установить XcodeGen
        run: brew install xcodegen

      - name: Сгенерировать проект
        run: xcodegen generate

      - name: Номер сборки из счётчика запусков
        run: |
          # Уникальный build number на каждый запуск — иначе устройство
          # может считать сборку той же самой и не обновить приложение.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" App/Info.plist

      - name: Архив без подписи
        run: |
          set -o pipefail
          # Пустые DEVELOPMENT_TEAM и PROVISIONING_PROFILE обязательны:
          # без них Xcode всё равно ищет сертификат и падает на архиве.
          xcodebuild archive \
            -project LinguaQuest.xcodeproj \
            -scheme LinguaQuest \
            -configuration Release \
            -archivePath build/LinguaQuest.xcarchive \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee archive.log

      - name: Упаковать .app в .ipa
        run: |
          # .ipa — это zip с папкой Payload внутри. Подписи нет,
          # её поставит Sideloadly на твоём компьютере.
          mkdir -p build/Payload
          cp -r build/LinguaQuest.xcarchive/Products/Applications/LinguaQuest.app build/Payload/
          cd build
          zip -qry LinguaQuest-unsigned.ipa Payload
          ls -lh LinguaQuest-unsigned.ipa

      - name: Отчёт
        if: always()
        run: |
          mkdir -p ci-status
          {
            echo "# Сборка IPA #${{ github.run_number }} — ${{ job.status }}"
            echo
            echo "- Коммит: \`${{ github.sha }}\`"
            echo "- Время: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- Запуск: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            if [ -f build/LinguaQuest-unsigned.ipa ]; then
              echo "IPA готов ($(du -h build/LinguaQuest-unsigned.ipa | cut -f1)):"
              echo "скачай артефакт \`LinguaQuest-ipa\` со страницы запуска и установи через Sideloadly."
              echo "Инструкция: \`Docs/deploy-to-iphone.md\`"
            else
              echo '## Ошибки архива'
              echo '```'
              grep -E "error:|The following build commands failed|Command .* failed" archive.log 2>/dev/null \
                | sort -u | head -40 || echo "(шаблон error: не сработал)"
              echo '```'
              echo
              echo '## Хвост лога'
              echo '```'
              tail -40 archive.log 2>/dev/null || echo "(лога нет)"
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY" > ci-status/last-ipa.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Тег указывает на коммит, а отчёт нужен в main.
          git fetch origin main
          git checkout -B main origin/main
          cp ci-status/last-ipa.md /tmp/last-ipa.md
          mkdir -p ci-status && cp /tmp/last-ipa.md ci-status/last-ipa.md
          git add ci-status/last-ipa.md
          git commit -m "CI: результат сборки IPA #${{ github.run_number }} [skip ci]" || exit 0
          git push origin main || echo "Отчёт не записан — не критично"

      - name: Загрузить IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LinguaQuest-ipa
          path: build/LinguaQuest-unsigned.ipa
          retention-days: 30

      - name: Лог архива
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-log
          path: archive.log
          retention-days: 14
