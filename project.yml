name: LinguaQuest

options:
  bundleIdPrefix: com.linguaquest
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  LinguaQuestKit:
    path: Packages/LinguaQuestKit

targets:
  LinguaQuest:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
    dependencies:
      - package: LinguaQuestKit
        product: Core
      - package: LinguaQuestKit
        product: ContentModels
      - package: LinguaQuestKit
        product: LessonEngine
      - package: LinguaQuestKit
        product: SRSEngine
      - package: LinguaQuestKit
        product: Persistence
      - package: LinguaQuestKit
        product: SpeechKit
      - package: LinguaQuestKit
        product: UIComponents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linguaquest.app
        PRODUCT_NAME: LinguaQuest
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: true
      # Тесты живут в пакете LinguaQuestKit. Xcode подхватывает их автоматически:
      # Product → Test прогоняет тест-таргеты локального пакета.
